<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>外匯申報 APP</title>
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="外匯申報">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --alt:#F5F5F7; --tile:#FFFFFF; --ink:#1D1D1F; --ink2:#6E6E73; --rule:#D2D2D7; --hover:#F0F0F2;
  --accent:#0071E3; --link:#0066CC; --onaccent:#FFFFFF;
  --seal:#D70015; --mid:#B64400; --low:#248A3D;
  --navbg:rgba(255,255,255,.78);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --alt:#161617; --tile:#1D1D1F; --ink:#F5F5F7; --ink2:#A1A1A6; --rule:#424245; --hover:#232325;
    --accent:#0A84FF; --link:#2997FF; --onaccent:#FFFFFF;
    --seal:#FF453A; --mid:#FF9F0A; --low:#30D158;
    --navbg:rgba(22,22,23,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --alt:#161617; --tile:#1D1D1F; --ink:#F5F5F7; --ink2:#A1A1A6; --rule:#424245; --hover:#232325;
  --accent:#0A84FF; --link:#2997FF; --onaccent:#FFFFFF;
  --seal:#FF453A; --mid:#FF9F0A; --low:#30D158;
  --navbg:rgba(22,22,23,.8);
  color-scheme:dark;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 56px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro TC","SF Pro Text","PingFang TC","Helvetica Neue","Noto Sans TC","Microsoft JhengHei",sans-serif;
  font-size:17px;line-height:1.6;letter-spacing:.005em;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navbg);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}

/* hero */
.hero{text-align:center;padding:clamp(72px,12vw,140px) 22px clamp(56px,8vw,96px)}
.hero-in{max-width:1040px;margin:0 auto}

.hero-name{font-size:clamp(19px,2.2vw,24px);font-weight:600;color:var(--ink2);margin:0 0 14px}
.hero h1{font-size:clamp(46px,8.4vw,96px);line-height:1.05;letter-spacing:-.02em;font-weight:700;margin:0}
.hero .lede{font-size:clamp(19px,2.4vw,26px);line-height:1.4;font-weight:500;color:var(--ink);margin:24px auto 0;max-width:30em}
.hero-cta{display:flex;justify-content:center;align-items:center;gap:28px;flex-wrap:wrap;margin-top:36px}
.demo-flag{margin:40px 0 0;font-size:13px;color:var(--ink2)}
@media (prefers-reduced-motion:no-preference){
  .hero h1,.hero .lede,.hero-cta{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
  .hero-cta{animation-delay:.12s}
  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
}

/* local nav */
.localnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navbg);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--rule)}
.ln-in{max-width:980px;margin:0 auto;padding:0 22px;height:52px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.ln-title{font-size:19px;font-weight:600;white-space:nowrap;letter-spacing:-.005em}
.tabs{display:flex;gap:22px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;background:none;border:0;color:var(--ink2);font:inherit;font-size:14px;padding:6px 0;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);font-weight:600;box-shadow:inset 0 -2px 0 var(--ink)}
@media (max-width:640px){ .ln-title{display:none} .ln-in{justify-content:flex-start} .tabs{gap:20px} }

/* content */
.wrap{max-width:980px;margin:0 auto;padding:clamp(48px,7vw,88px) 22px 96px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.simtag{display:inline-block;margin:0 0 8px;padding:2px 10px;border-radius:999px;background:#FFF1E0;color:#8A3B00;font-size:12px;font-weight:600}
.simban{background:#FFF1E0;color:#8A3B00;border:1px solid #F5C08A;border-radius:14px;padding:12px 18px;font-weight:600;font-size:15px;line-height:1.55;margin:0 0 22px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .simban{background:#3A2410;color:#FFD3A3;border-color:#7A4A1C}}
:root[data-theme="dark"] .simban{background:#3A2410;color:#FFD3A3;border-color:#7A4A1C}
.res-h{margin:34px 0 12px}
.presets{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.presets button{border:1px solid var(--rule);background:var(--bg,transparent);color:var(--ink);border-radius:999px;padding:7px 14px;font:inherit;font-size:14px;cursor:pointer}
.presets button.on{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
h2.big{font-size:clamp(34px,5.6vw,56px);line-height:1.1;letter-spacing:-.015em;font-weight:700;margin:0 0 22px}
h3{font-size:clamp(26px,3.4vw,34px);line-height:1.2;letter-spacing:-.01em;font-weight:700;margin:clamp(64px,9vw,104px) 0 20px}
#view > p{max-width:42em;margin:0 0 32px}
h1,h2,h3,.q,.lede{text-wrap:balance}
td .link{white-space:nowrap;padding:0}
.small{font-size:14px;color:var(--ink2);line-height:1.55}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:clamp(24px,4vw,48px);margin:40px 0 20px;
  background:var(--alt);border-radius:28px;padding:clamp(28px,4.5vw,52px)}
.kpi .n{font-size:clamp(44px,6.2vw,68px);font-weight:700;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi.hi .n{color:var(--accent)}
.kpi p{margin:14px 0 0;font-size:15px;color:var(--ink2);line-height:1.5}

.flow{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:24px 0 28px}
.node{background:var(--alt);border-radius:16px;padding:16px 20px;font-weight:600;font-size:17px}
.node.accent{background:var(--accent);color:var(--onaccent)}
.arr{padding-bottom:16px}
.arr::before{content:"›";color:var(--ink2);font-size:28px;line-height:1}
.outs{display:flex;flex-direction:column;gap:8px}
.lane{font-size:13px;color:var(--ink2);margin:0 0 8px}
@media (max-width:640px){ .flow{flex-direction:column;align-items:stretch} .arr{text-align:center;padding:0} .arr::before{display:inline-block;transform:rotate(90deg)} }

.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;border-bottom:1px solid var(--rule);padding:14px 16px 14px 0;vertical-align:top}
thead th{color:var(--ink2);font-weight:600;font-size:13px;padding-top:8px}
tbody th{color:var(--ink2);font-weight:500;font-size:14px;white-space:nowrap}
tr.click{cursor:pointer} tr.click:hover td{background:var(--hover)} tr.sel td{background:var(--hover)}
.badge{display:inline-block;border-radius:980px;padding:2px 10px;font-size:13px;font-weight:600;white-space:nowrap;
  color:var(--b);background:color-mix(in srgb,var(--b) 12%,transparent)}
.badge.aml{--b:var(--seal)} .badge.fx{--b:var(--mid)} .badge.pass{--b:var(--low)}
.code{font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.01em}

.panel{background:var(--alt);border-radius:28px;padding:clamp(26px,4.5vw,52px)}
.step{color:var(--ink2);font-size:14px;font-weight:500;margin:0 0 10px}
.q{font-size:clamp(26px,3.6vw,36px);line-height:1.2;letter-spacing:-.012em;margin:0 0 10px;font-weight:700}
.hint{color:var(--ink2);margin:0 0 8px;font-size:16px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:28px}
.opt{appearance:none;text-align:left;background:var(--tile);border:1px solid var(--rule);color:var(--ink);font:inherit;font-size:17px;font-weight:500;
  padding:20px 22px;border-radius:16px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.opt:hover{border-color:var(--ink2)}
.opt:active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.row{display:flex;gap:24px;flex-wrap:wrap;margin-top:28px;align-items:center}
.btn{appearance:none;font:inherit;font-size:17px;font-weight:500;padding:12px 24px;border-radius:980px;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:var(--onaccent);transition:filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--link);border-color:var(--link)}
.link{appearance:none;background:none;border:0;color:var(--link);font:inherit;cursor:pointer;padding:6px 0;text-decoration:none}
.link:hover{text-decoration:underline}
.chev::after{content:" ›"}

.slip{background:var(--alt);border-radius:28px;padding:clamp(26px,4.5vw,52px)}
.slip dl{display:grid;grid-template-columns:6em 1fr;gap:14px 24px;margin:0;align-items:baseline}
.slip dt{color:var(--ink2);font-size:14px}
.slip dd{margin:0;font-size:17px}
.slip .bigcode{font-size:clamp(56px,9vw,88px);font-weight:700;line-height:1;letter-spacing:-.02em;color:var(--accent)}
label.f{display:block;margin-top:20px;font-weight:600;font-size:15px}
.fxbar{font-size:14px;color:var(--ink2);line-height:1.6;margin:16px 0;padding:12px 14px;border:1px solid var(--rule);border-radius:12px;background:var(--tile)}
.fxbar .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px;background:var(--mid)}
.fxbar .dot.live{background:var(--low)} .fxbar .dot.fb{background:var(--seal)} .fxbar .dot.old{background:var(--mid)}
.fxbar .fxup{margin-top:10px;padding-top:10px;border-top:1px solid var(--rule)} .fxbar .fxup .filebtn{margin:6px 0} .fxbar .upmsg.ok{color:var(--low)} .fxbar .upmsg.err{color:var(--seal)}
.fxbar strong{color:var(--ink)} .fxbar .link{font-size:14px}
.fxbar details{margin-top:8px} .fxbar summary{cursor:pointer;color:var(--accent)}
.fxbar table{font-size:13px;margin-top:8px} .fxbar td,.fxbar th{padding:4px 8px}
.conv{margin-top:14px} .conv th{white-space:nowrap}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
input[type=text],input[type=number],select{font:inherit;font-size:17px;color:var(--ink);background:var(--tile);border:1px solid var(--rule);border-radius:12px;padding:12px 14px;width:100%;margin-top:8px}
input[type=text]:focus,input[type=number]:focus,select:focus{border-color:var(--accent)}
input[type=checkbox]{accent-color:var(--accent);width:18px;height:18px;vertical-align:-3px;margin-right:6px}

.detail{margin-top:20px;background:var(--alt);border-radius:20px;padding:24px 26px}
.hits{margin:10px 0 0;padding-left:1.2em}
.hits li{margin:4px 0}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:20px 0}
.cmp .box{background:var(--alt);border-radius:20px;padding:24px}
.cmp .box.hi{background:var(--tile);box-shadow:inset 0 0 0 2px var(--accent)}
.cmp .n{font-size:clamp(34px,5vw,48px);font-weight:700;letter-spacing:-.015em;font-variant-numeric:tabular-nums}
.cmp .box.hi .n{color:var(--accent)}
@media (max-width:560px){ .cmp{grid-template-columns:1fr} .slip dl{grid-template-columns:1fr;gap:4px} .slip dd{margin-bottom:12px} }

.sliders{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:28px 40px}
.sl label{display:flex;justify-content:space-between;font-weight:600;font-size:16px}
.sl output{color:var(--accent);font-variant-numeric:tabular-nums}
.sl input{width:100%;accent-color:var(--accent);margin:12px 0 4px}
.sl p{margin:2px 0 0;font-size:13px;color:var(--ink2)}
svg text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}
.toggle{display:inline-flex;gap:4px;align-items:center;font-size:15px}

.foot{background:var(--alt);border-top:1px solid var(--rule)}
.note{max-width:980px;margin:0 auto;padding:28px 22px 40px;font-size:12px;line-height:1.6;color:var(--ink2)}
.note-h{margin:0 0 10px;font-size:12px;font-weight:600;color:var(--ink)}
.note-list{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.note-list li{position:relative;padding-left:14px;display:grid;grid-template-columns:5.6em 1fr;column-gap:10px}
.note-list li::before{content:"";position:absolute;left:2px;top:.62em;width:4px;height:4px;border-radius:50%;background:var(--ink2)}
.note-list b{font-weight:600;color:var(--ink)}
@media(max-width:600px){.note-list li{grid-template-columns:1fr}}

/* ===== v2 additions ===== */
html,body{overflow-x:clip}
.wrap.bleed{padding-top:0;padding-bottom:0}
.band{width:100vw;margin-left:calc(50% - 50vw);padding:clamp(88px,12vw,150px) 0}
.band-in{max-width:980px;margin:0 auto;padding:0 22px}
.band p{max-width:42em}
.band h2.big{margin-bottom:24px}
.band.grey{background:var(--alt)}
.band.dark{--ink:#F5F5F7;--ink2:#A1A1A6;--accent:#2997FF;--rule:#424245;--alt:#1D1D1F;--tile:#1D1D1F;background:#000;color:var(--ink)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .band.dark{background:#1D1D1F;--alt:#2C2C2E} }
:root[data-theme="dark"] .band.dark{background:#1D1D1F;--alt:#2C2C2E}
.band.grey + .band.grey{padding-top:0}

/* hero visual */
.hero{padding-bottom:0}
.hero-visual{position:relative;max-width:1040px;height:700px;margin:clamp(56px,7vw,88px) auto 0}
.phone{width:300px;height:620px;border-radius:54px;background:#1D1D1F;padding:11px;
  box-shadow:inset 0 0 0 2px #3A3A3C,0 50px 90px -40px rgba(0,0,0,.45)}
.hero-visual .phone{position:absolute;left:50%;top:0;margin-left:-150px;z-index:2}
.screen{position:relative;height:100%;border-radius:44px;background:var(--bg);overflow:hidden;padding:62px 18px 18px;text-align:left}
.island{position:absolute;top:12px;left:50%;width:100px;height:30px;margin-left:-50px;border-radius:20px;background:#000}
.ps-bar{display:flex;justify-content:space-between;position:absolute;top:18px;left:30px;right:30px;font-size:13px;font-weight:600}
.ps-step{font-size:12px;color:var(--ink2);margin:6px 0 6px}
.ps-q{font-size:23px;font-weight:700;line-height:1.25;margin:0 0 18px;letter-spacing:-.01em}
.ps-opt{border:1px solid var(--rule);border-radius:13px;padding:12px 14px;font-size:14px;font-weight:500;margin-bottom:9px;background:var(--tile)}
.ps-next{position:absolute;left:18px;right:18px;bottom:22px;background:var(--accent);color:var(--onaccent);border-radius:980px;text-align:center;padding:12px;font-size:15px;font-weight:600}
.ps-opt.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.float{position:absolute;z-index:3;background:var(--tile);border-radius:24px;padding:22px 24px;text-align:left;
  box-shadow:0 30px 70px -28px rgba(0,0,0,.28),0 0 0 1px var(--rule)}
.float .lane{margin:0 0 10px}
.float.l{left:calc(50% - 440px);top:150px;width:290px}
.float.r{right:calc(50% - 470px);top:310px;width:320px}
.f-code{font-size:56px;font-weight:700;line-height:1;letter-spacing:-.02em;color:var(--accent)}
.f-name{font-size:17px;font-weight:600;margin:8px 0 12px}
.f-narr{font-size:13px;color:var(--ink2);border-top:1px solid var(--rule);padding-top:12px}
.f-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--rule);font-size:14px}
.f-row:first-of-type{border-top:0}
.f-row .code{margin-right:6px}
@media (max-width:860px){
  .hero-visual{height:auto;display:flex;flex-direction:column;align-items:center;gap:16px}
  .hero-visual .phone{position:relative;left:auto;margin-left:0}
  .float{position:relative;left:auto!important;right:auto!important;top:auto!important;width:min(100%,360px)!important}
  .hero-visual .phone{order:-1;width:276px;height:570px}
  .hero-visual .ps-opt{padding:9px 12px;font-size:13px;margin-bottom:7px}
  .hero-visual .ps-q{font-size:20px}
}
@media (prefers-reduced-motion:no-preference){
  .hero-visual .phone{animation:rise 1s .3s cubic-bezier(.2,.7,.2,1) both}
  .float.l{animation:fromL 1s .6s cubic-bezier(.2,.7,.2,1) both}
  .float.r{animation:fromR 1s .75s cubic-bezier(.2,.7,.2,1) both}
  @keyframes fromL{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
  @keyframes fromR{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
}
.hero + .localnav{margin-top:-1px}
.hero{border-bottom:0}
.hero-base{height:1px}

/* fork diagram */
.fork{display:grid;grid-template-columns:1fr 72px 1fr;align-items:center;margin-top:48px;max-width:760px}
.fork-arrow{text-align:center;color:var(--accent);font-size:34px;font-weight:300;line-height:1}
.fork-src{background:var(--accent);color:var(--onaccent);border-radius:22px;padding:26px 28px;font-size:21px;font-weight:700;line-height:1.3}
.fork-outs{display:flex;flex-direction:column;gap:14px}
.fork-out{background:var(--alt);border-radius:18px;padding:16px 20px;display:flex;gap:14px;align-items:center}
.fork-out i{flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--onaccent);font-style:normal;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center}
.fork-out b{display:block;font-size:17px}
.fork-out span{font-size:14px;color:var(--ink2)}
@media (max-width:640px){ .fork{grid-template-columns:1fr} .fork-arrow{transform:rotate(90deg);margin:14px 0} }

/* reveal */
.reveal{display:grid;grid-template-columns:1fr 1fr;gap:clamp(32px,6vw,72px);margin-top:56px}
.rv-n{font-size:clamp(64px,11vw,128px);font-weight:700;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.rv.hi .rv-n{color:var(--accent)}
.rv-tag{font-size:17px;font-weight:600;margin:0 0 14px;color:var(--ink2)}
.rv.hi .rv-tag{color:var(--ink)}
.bar{height:10px;border-radius:10px;background:var(--alt);margin:24px 0 18px;overflow:hidden}
.bar span{display:block;height:100%;width:var(--w);border-radius:10px;background:var(--ink2);transition:width 1.4s cubic-bezier(.2,.7,.2,1)}
.rv.hi .bar span{background:var(--accent)}
.rv p{font-size:15px;color:var(--ink2);margin:0}
.reveal.pre .bar span{width:0}
.rv-sub{display:flex;gap:28px;align-items:baseline;flex-wrap:wrap;margin-top:72px;padding-top:40px;border-top:1px solid var(--rule)}
.rv-sub .rv-n{font-size:clamp(48px,7vw,80px)}
.rv-sub p{margin:0;font-size:15px;color:var(--ink2);max-width:22em}
.band.dark .small{margin-top:40px}
.band p.fnote{max-width:none;margin:48px 0 0;padding:18px 0 0;border-top:1px solid var(--rule);font-size:13px;line-height:1.65;color:var(--ink2)}
@media (max-width:640px){ .reveal{grid-template-columns:1fr} }

/* story */
.story{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(32px,6vw,80px);margin-top:48px}
.story-fig{position:sticky;top:calc(env(safe-area-inset-top,0px) + 52px + 56px);align-self:start;background:var(--tile);border-radius:28px;padding:32px 28px}
.sn{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:16px;font-weight:600;font-size:17px;color:var(--ink2);transition:background .4s,color .4s}

const DG = '零壹貳參肆伍陸柒捌玖';
function capNum(n){
  if(n === 0) return '零';
  const U = ['', '拾', '佰', '仟'], B = ['', '萬', '億', '兆'];
  let out = '', bi = 0, needZero = false;
  while(n > 0){
    const sec = n % 10000; n = Math.floor(n / 10000);
    if(sec){
      let s = '', z = false;
      for(let k = 0; k < 4; k++){ const d = Math.floor(sec / Math.pow(10, k)) % 10; if(d){ s = DG[d] + U[k] + (z && s ? '零' : '') + s; z = false; } else z = true; }
      out = s + B[bi] + (needZero && out ? '零' : '') + out; needZero = sec < 1000;
    } else if(out) needZero = true;
    bi++;
  }
  return out;
}
function capAmt(cur, x){
  const n = Math.round((+x || 0) * 100), i = Math.floor(n / 100), j = Math.floor(n / 10) % 10, fe = n % 10;

const LIB = {h2c:'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js', pdf:'https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js', jsqr:'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js'};
const libP = {};
const loadLib = k => libP[k] || (libP[k] = new Promise((res, rej) => { const s = document.createElement('script'); s.src = LIB[k]; s.onload = res; s.onerror = () => { delete libP[k]; rej(new Error('lib')); }; document.head.appendChild(s); }));
async function makePdf(html){
  await Promise.all([loadLib('h2c'), loadLib('pdf')]);
  const host = document.createElement('div'); host.className = 'print-host'; host.innerHTML = html; document.body.appendChild(host);
  try{
    if(document.fonts && document.fonts.ready) await document.fonts.ready;
    await Promise.all(Array.from(host.querySelectorAll('img')).map(im => im.complete ? 0 : new Promise(r => { im.onload = im.onerror = r; })));
    const cv = await window.html2canvas(host.firstElementChild, {scale:2, backgroundColor:'#ffffff', logging:false});
    const pdf = new window.jspdf.jsPDF({unit:'mm', format:'a4', orientation:'portrait'});
    let w = 210, h = cv.height * 210 / cv.width; if(h > 297){ h = 297; w = cv.width * 297 / cv.height; }
    pdf.addImage(cv.toDataURL('image/jpeg', 0.92), 'JPEG', (210 - w) / 2, 0, w, h);
    return pdf.output('blob');
  } finally { host.remove(); }
}
async function saveFile(btn, filename, makeBlob){
  if(!DL) return;
  const old = btn.textContent; btn.disabled = true; btn.textContent = '準備檔案中…';
  try{ const blob = await makeBlob(); btn.textContent = '等待確認…'; await DL.save({filename, data:blob}); btn.textContent = '已下載'; }
  catch(e){ btn.textContent = e && e.code === 'declined' ? old : '下載失敗，請再試一次'; }
  finally{ btn.disabled = false; setTimeout(() => { btn.textContent = old; }, 2400); }
}

function telLoad(p, via){
  let cs = tel.cases[p.k];
  if(!cs){ cs = tel.cases[p.k] = {k:p.k, A:null, B:null, D:null, rate:null, caseNo:'', memoNo:'', final:null, reason:'', sent:null}; tel.order.unshift(p.k); }
  cs[p.t] = p; if(cs.rate == null){ cs.rate = boardRate(p.f.cur, p.f.pay, p.d === 'in' ? 'in' : 'out') || ''; cs.rateAuto = true; } if(cs.final == null) cs.final = p.dc || '';
  tel.active = p.k; tel.doc = p.t;
  telMsg(docName(p) + '已帶入（' + via + '）', 'ok');
  if(DB && p.c) DB.doc('prefill/' + p.c).update({used:true, usedAt:Date.now()}).catch(() => {});
}
function validPayload(p){ return p && p.v === 4 && (p.t === 'A' || p.t === 'B' || p.t === 'D') && typeof p.k === 'string' && p.f && typeof p.e === 'string'; }
async function telFromText(text, via){
  if(typeof text !== 'string' || text.indexOf(QR_PREFIX) !== 0){ telMsg('這不是本系統產生的 QR Code', 'err'); return; }
  let p; try{ p = JSON.parse(text.slice(QR_PREFIX.length)); }catch(e){ telMsg('QR Code 內容無法解讀，請客戶重新產生', 'err'); return; }
  if(!validPayload(p)){ telMsg('QR Code 內容不完整，請客戶重新產生', 'err'); return; }
  if(p.e < todayStr()){ telMsg('這份資料限 ' + p.e.replace(/-/g, '/') + ' 當日有效，已逾期，請客戶重新產生', 'err'); return; }
  if(DB && p.c){ try{ const s = await withTimeout(DB.doc('prefill/' + p.c).get(), 5000); if(s.exists && s.data().used){ telMsg('這份資料已於 ' + hhmm(s.data().usedAt) + ' 帶入，已失效', 'err'); return; } }catch(e){} }
  telLoad(p, via);

async function telByCode(raw){
  const c = String(raw || '').toUpperCase().replace(/[^0-9A-Z]/g, '');
  if(c.length !== 8){ telMsg('預填代號為 8 碼英數字，例如 7KQ4-M2XA', 'err'); return; }
  if(!DB){ telMsg('此檢視無法連線暫存資料，請改掃 QR Code 或上傳 QR Code 圖片', 'err'); return; }
  telMsg('查詢中…', '');
  try{
    const s = await withTimeout(DB.doc('prefill/' + c).get(), 8000);
    if(!s.exists){ telMsg('查無此代號，請確認是否輸入正確', 'err'); return; }
    const d = s.data();
    if(d.used){ telMsg('此代號已於 ' + hhmm(d.usedAt) + ' 帶入，已失效', 'err'); return; }
    if(d.validUntil < todayStr()){ telMsg('此代號限 ' + d.validUntil.replace(/-/g, '/') + ' 當日有效，已逾期', 'err'); return; }
    const p = JSON.parse(d.payload); if(!validPayload(p)){ telMsg('代號資料不完整，請客戶重新產生', 'err'); return; }
    telLoad(p, '預填代號'); renderTeller();
  }catch(e){ telMsg('查詢失敗，請稍後再試，或改用 QR Code', 'err'); }
}
async function decodeImage(file){
  try{ await loadLib('jsqr'); }catch(e){ telMsg('QR Code 辨識元件載入失敗，請改輸入預填代號', 'err'); return; }
  const url = URL.createObjectURL(file), img = new Image();
  img.onload = async () => {
    const s = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
    const x = c.getContext('2d'); x.drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
    const r = window.jsQR(x.getImageData(0, 0, c.width, c.height).data, c.width, c.height, {inversionAttempts:'attemptBoth'});
    if(!r){ telMsg('未能辨識 QR Code，請確認圖片清楚、完整', 'err'); return; }
    await telFromText(r.data, '上傳 QR Code 圖片'); renderTeller();
  };
  img.onerror = () => telMsg('無法讀取這個圖片檔', 'err');

}

  const opts = '<option value="">請選擇分類</option>' + groupsFor(dd).map(g => '<optgroup label="' + g[0] + '">' + g[1].map(k => '<option value="' + k + '"' + (cs.final === k ? ' selected' : '') + '>' + k + ' ' + esc(codeName(k, dd)) + '</option>').join('') + '</optgroup>').join('');
  const changed = cs.final !== (base.dc || ''), ntd = Math.round((+f.amt || 0) * (+cs.rate || 0)), needX = base.x && !(base.t === 'D' ? A : D);
  const docs = ['A','B','D'].filter(t => cs[t]);
  view.innerHTML = '<p class="eyebrow">案件 ' + esc(fmtCode(cs.k)) + '</p><h1 class="hq">' + esc(f.apNameZh || f.apName || '') + '</h1><p class="hsub">' + esc(money(f.cur, f.amt)) + '・' + esc(A ? docName(A) : '') + '</p>' +
    '<div class="tcard"><div class="pills"><span class="pill">申報 ' + esc(base.dc || '待確認') + '</span><span class="pill">推導 ' + esc(base.m || '無法唯一推導') + '</span><span class="pill ' + (same ? 'ok' : 'warn') + '">' + (same ? '一致' : '需確認') + '</span></div>' +
      (reasons.length ? '<div class="note1 warn">' + reasons.map(esc).join('<br>') + '</div>' : '') +
      (needX ? '<div class="note1">本案還有一份文件，請回上一頁輸入另一組代號或掃描另一個 QR Code。</div>' : '') +
      '<div class="fld"><label class="f" for="tfinal">確認分類</label><select id="tfinal">' + opts + '</select></div>' +
      (changed ? '<div class="fld"><label class="f" for="treason">更正原因</label><input id="treason" type="text" value="' + esc(cs.reason) + '" placeholder="例如：客戶補充說明為顧問服務"></div>' : '') +
      '<div class="fld"><label class="f" for="trate">匯率</label><input id="trate" type="number" inputmode="decimal" step="0.0001" min="0" value="' + esc(cs.rate) + '"><p class="fh" id="trateh">' + esc(rateHint(cs, f)) + '</p></div>' +
      '<div class="fld"><p class="f">' + (f.pay === 'twd' ? '新臺幣金額' : '等值新臺幣') + '</p><p class="tv" id="tntd">' + ntdText(f, ntd) + '</p></div><div id="tthr">' + thrHtml(base, f, ntd) + '</div>' +
      (D || base.x ? '<div class="fld"><label class="f" for="tcase">送件編號</label><input id="tcase" type="text" value="' + esc(cs.caseNo) + '"></div><div class="fld"><label class="f" for="tmemo">外匯水單編號</label><input id="tmemo" type="text" value="' + esc(cs.memoNo) + '"></div>' : '') +
    '</div>' +
    '<div class="acts">' + docs.map(t => '<button class="btn ghost" data-tdoc="' + t + '">預覽' + (t === 'D' ? '申報書' : '申請書') + '</button>').join('') + '</div>' +
    '<details class="ans"><summary>客戶作答紀錄（' + Object.keys(parseAns(base.ans)).length + ' 題）</summary><div class="tablewrap"><table><tbody>' + ansList(base.ans) + '</tbody></table></div></details>' +
    '<p id="telmsg" class="tmsg ' + tel.mt + '"' + (tel.msg ? '' : ' hidden') + ' role="status">' + esc(tel.msg) + '</p>' +
    '<div class="appnav"><span></span>' + (cs.sent ? '<span class="pill ok">已完成受理（' + esc(cs.sent) + '）</span>' : '<button class="btn" id="tsend"' + (A && cs.final ? '' : ' disabled') + '>完成受理</button>') + '</div>';
  const telObj = () => ({rate:cs.rate, caseNo:cs.caseNo, memoNo:cs.memoNo});
  view.querySelectorAll('[data-tdoc]').forEach(b => b.addEventListener('click', () => docSheet(cs[b.dataset.tdoc], telObj())));
  view.querySelector('#tfinal').addEventListener('change', e => { cs.final = e.target.value; renderTeller(); });
  const tr = view.querySelector('#treason'); if(tr) tr.addEventListener('input', e => { cs.reason = e.target.value; });
  view.querySelector('#trate').addEventListener('input', e => { cs.rate = e.target.value; cs.rateAuto = false; const nt = Math.round((+f.amt || 0) * (+cs.rate || 0)); view.querySelector('#tntd').textContent = ntdText(f, nt); view.querySelector('#trateh').textContent = rateHint(cs, f); view.querySelector('#tthr').innerHTML = thrHtml(base, f, nt); });
  ['tcase','tmemo'].forEach(id => { const el = view.querySelector('#' + id); if(el) el.addEventListener('input', e => { cs[id === 'tcase' ? 'caseNo' : 'memoNo'] = e.target.value; }); });
  const ts = view.querySelector('#tsend'); if(ts) ts.addEventListener('click', () => {
    const fa = A.f, din = A.d === 'in';
    if(cs.final !== (A.dc || '') && !cs.reason.trim()){ telMsg('分類有更正時，請填寫更正原因', 'err'); const t2 = view.querySelector('#treason'); if(t2) t2.focus(); return; }
    const t = {id:'C' + String(custTxns.length + 1).padStart(2, '0'), source:'行員受理', who: A.w === 'person' ? '個人' : '公司', declared:cs.final, mtfd:A.m || null,
      ben:{name:din ? fa.rmName : fa.bfName}, memo:fa.memo || '', dir:din ? 'in' : 'out', src:fa.pay, cur:fa.cur, amt:+fa.amt || 0, rate:+cs.rate || null, similar:0, passThrough:false, truth: A.o ? '客戶改填類別' : '依事實申報',
      extra:{swift:din ? fa.rmSwift : fa.bkSwift, bank:din ? fa.rmBank : fa.bkName, cty:ctyZh(fa.cty, fa.ctyOther), fx:money(fa.cur, fa.amt), decl: A.x ? (cs.D ? '已附（' + fmtCode(A.x) + '）' : '應附未帶入（' + fmtCode(A.x) + '）') : '未達門檻，不需申報書', corr: cs.final !== (A.dc || '') ? {from:A.dc || '待確認', to:cs.final, reason:cs.reason.trim()} : null}};
    custTxns.unshift(t); cs.sent = t.id; selId = t.id; telMsg('已完成受理，編號 ' + t.id + (t.extra.corr ? '；分類更正紀錄已保存' : ''), 'ok'); renderTeller();
  });
}

/* ---------- 切換 ---------- */
function show(t){
  if(!['home','customer','teller'].includes(t)) t = 'home';
  if(t !== 'teller') stopCam();
  curTab = t;
  document.body.dataset.mode = t;
  ({home:renderHome, customer:renderCustomer, teller:renderTeller})[t]();
  topY();
}

if(window.claude && typeof window.claude.use === 'function'){
  const refresh = () => { if(curTab === 'customer' && cust.stage === 'out') renderCustomer(); };
  dbReady = window.claude.use('db').then(d => { DB = d; return d; }).catch(() => null);
  window.claude.use('user').then(u => { USER = u; }).catch(() => {});
  window.claude.use('downloads').then(d => { DL = d; refresh(); }).catch(() => {});
} else {
  /* 部署在 Netlify 時：預填代號改存網站後端，下載改用瀏覽器下載 */
  DB = {doc: path => {
    const url = '/api/prefill/' + encodeURIComponent(String(path).split('/')[1] || '');
    return {
      set: async obj => { const r = await fetch(url, {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(obj)}); if(!r.ok) throw new Error('save failed'); },
      get: async () => { const r = await fetch(url, {cache:'no-store'}); if(!r.ok) throw new Error('get failed'); const j = await r.json(); return {exists:!!j.exists, data:() => j.data}; },
      update: async () => { const r = await fetch(url, {method:'PATCH'}); if(!r.ok) throw new Error('update failed'); }
    };
  }};
  DL = {save: async ({filename, data}) => { const u = URL.createObjectURL(data); const a = document.createElement('a'); a.href = u; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 5000); }};
}
loadRates();
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => show(b.dataset.t)));
document.querySelectorAll('.hero [data-go]').forEach(b => b.addEventListener('click', () => show(b.dataset.go, 'force')));

/* ---------- APP QR Code（浮動卡與全螢幕） ---------- */
(function appQr(){
  const fl = document.getElementById('qrFloat'); if(!fl) return;
  const APP_URL = 'https://fx-remittance-demo-v6.netlify.app/app/';
  const pill = document.getElementById('qrPill'), img = document.getElementById('qfImg');
  let url = '';
  try{ const q = qrMake(APP_URL); if(q) url = qrCanvas(q, 10).toDataURL('image/png'); }catch(e){}
  if(url) img.src = url;
  let min = false; try{ min = localStorage.getItem('fxQrMin') === '1'; }catch(e){}
  const sync = () => { fl.hidden = min; pill.hidden = !min; };
  sync();
  document.getElementById('qfMin').addEventListener('click', () => { min = true; try{ localStorage.setItem('fxQrMin', '1'); }catch(e){} sync(); pill.focus(); });
  pill.addEventListener('click', () => { min = false; try{ localStorage.setItem('fxQrMin', '0'); }catch(e){} sync(); });
  const openBig = () => {
    const ov = document.createElement('div'); ov.className = 'qrbig';
    ov.innerHTML = '<div class="qb" role="dialog" aria-modal="true" aria-labelledby="qbT">' + (url ? '<img src="' + url + '" alt="開啟外匯申報 APP 的 QR Code">' : '') +
      '<div class="qt"><p class="k">現場一起操作</p><h2 id="qbT">用手機掃描，打開 APP</h2><p>回答幾個白話問題，產生你的申請書與 QR Code。資料皆為虛構，請勿輸入真實個人資料。</p><p class="u">' + APP_URL.replace(/^https:\/\//, '').replace(/\/$/, '') + '</p><button class="btn ghost" data-x>關閉</button></div></div>';
    document.body.appendChild(ov);
    const close = () => { ov.remove(); document.removeEventListener('keydown', onKey); };
    const onKey = e => { if(e.key === 'Escape') close(); };
    document.addEventListener('keydown', onKey);
    ov.addEventListener('click', e => { if(e.target === ov || e.target.closest('[data-x]')) close(); });
    ov.querySelector('[data-x]').focus();
  };
  document.getElementById('qfBig').addEventListener('click', openBig);
  const ob = document.getElementById('qrOpen'); if(ob) ob.addEventListener('click', openBig);
})();
show('home');
})();
</script>
